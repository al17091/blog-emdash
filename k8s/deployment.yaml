apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-emdash
  labels:
    app: blog-emdash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-emdash
  template:
    metadata:
      labels:
        app: blog-emdash
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: ghcr.io/al17091/blog-emdash:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            # コンテナをポート80でListenさせる
            - name: PORT
              value: "80"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: blog-emdash-data-pvc
