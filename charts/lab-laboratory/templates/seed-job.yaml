{{- if .Values.seedJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lab-laboratory.fullname" . }}-seed
  labels:
    {{- include "lab-laboratory.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "lab-laboratory.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: EMDASH_DATA_DIR
              value: /data
            - name: PUBLIC_SHOW_ADMIN_LINK
              value: {{ .Values.env.PUBLIC_SHOW_ADMIN_LINK | quote }}
          args:
            - /bin/sh
            - -lc
            - |
              ./node_modules/.bin/emdash init
              if [ "{{ .Values.seedJob.includeContent }}" = "true" ]; then
                ./node_modules/.bin/emdash seed --on-conflict {{ .Values.seedJob.onConflict }}
              else
                ./node_modules/.bin/emdash seed --on-conflict {{ .Values.seedJob.onConflict }} --no-content
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "lab-laboratory.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
