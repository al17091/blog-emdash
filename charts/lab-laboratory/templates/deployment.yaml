apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lab-laboratory.fullname" . }}
  labels:
    {{- include "lab-laboratory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lab-laboratory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-laboratory.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
          env:
            - name: PUBLIC_SHOW_ADMIN_LINK
              value: {{ .Values.env.PUBLIC_SHOW_ADMIN_LINK | quote }}
            - name: EMDASH_DATA_DIR
              value: /data
            - name: EMDASH_DB
              value: {{ .Values.database.engine | quote }}
            {{- if .Values.database.url }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- else if .Values.database.urlFromSecret.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.urlFromSecret.name | quote }}
                  key: {{ .Values.database.urlFromSecret.key | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "lab-laboratory.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
