apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blog-emdash
  labels:
    app: blog-emdash
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: blog-emdash
          port: 80
      middlewares:
        - name: force-https-header
  tls: {}
