apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blog-emdash
  labels:
    app: blog-emdash
spec:
  entryPoints:
    - web
  routes:
    # External Route
    - match: {{ if .Values.ingress.matchRule }}{{ .Values.ingress.matchRule }}{{ else }}Host(`{{ .Values.ingress.host }}`) && !PathPrefix(`/_emdash/admin`){{ end }}
      kind: Rule
      middlewares:
        - name: force-https-header
      services:
        - name: blog-emdash
          port: 80

    {{- if .Values.ingress.internalHost }}
    # Internal Route
    - match: Host(`{{ .Values.ingress.internalHost }}`)
      kind: Rule
      middlewares:
        - name: force-https-header
      services:
        - name: blog-emdash
          port: 80
    {{- end }}

{{- if .Values.ingress.internalHost }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blog-emdash-internal-secure
  labels:
    app: blog-emdash
spec:
  entryPoints:
    - websecure
  routes:
    # Internal Route HTTPS
    - match: {{ if .Values.ingress.secureMatchRule }}{{ .Values.ingress.secureMatchRule }}{{ else }}Host(`{{ .Values.ingress.internalHost }}`){{ end }}
      kind: Rule
      middlewares:
        - name: force-https-header
      services:
        - name: blog-emdash
          port: 80
  tls:
    secretName: emdash-tls-secret
{{- end }}
